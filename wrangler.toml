# ───────────────────────────────────────────────
#  수업 관리 앱 설정 파일
#  ⚠️ 아래 "여기에_D1_ID" 한 곳만 원장님 D1 ID로 바꾸면 됩니다.
# ───────────────────────────────────────────────
name = "class-manager"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# 10분마다 자동 실행 (미리보기 만들기 · 자동 발송 · 30일 지난 사진 정리)
[triggers]
crons = ["*/10 * * * *"]

# 화면 파일(public 폴더)
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# 데이터베이스 (Cloudflare D1)
[[d1_databases]]
binding = "DB"
database_name = "class-manager-db"
database_id = "5c32dbc5-51ff-4003-8d26-03dccca0dd9f"

# 사진·영상 저장소 (Cloudflare R2)
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "class-manager-media"

# 배포할 때마다 새 버전 번호를 자동으로 붙여 줌 (선생님 휴대폰 화면 자동 새로고침용)
[version_metadata]
binding = "CF_VERSION_METADATA"

[observability]
enabled = true
